<rect x="0" y="0" width="940" height="560" fill="#FFFFFF"/>
<title>Module rev C: lead 5 through the M7 reverse diode and TVS to the +12 V rail; LMR16006X buck to 3.3 V; 1 M / 68k supply divider to GPIO3; UP and DOWN lines through divider, filter, zener and 2N7002 buffers to GPIO1 (UP) and GPIO0 (DOWN), active low; GPIO10 drives the relay coil through a 2.2k resistor and an MMBTA06 NPN with 100k pull-down and flyback diode; GPIO7 status LED; GPIO6 side jumper.</title>
