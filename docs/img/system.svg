<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300">
<style>
text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #1B2430; font-size: 12px; }
.lbl { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #5A6675; }
.ttl { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #1B2430; }
.box { fill: #FFFFFF; stroke: #1B2430; stroke-width: 1.5; }
.box-soft { fill: #DCE8F3; stroke: #5B7FA5; stroke-width: 1.5; }
.frame { fill: none; stroke: #5A6675; stroke-width: 1.5; stroke-dasharray: 6 4; }
.coil { fill: #FFFFFF; stroke: #6B4FA0; stroke-width: 2; }
.part { fill: #FFFFFF; stroke: #1B2430; stroke-width: 1.6; }
.fuse { fill: #FFFFFF; stroke: #B57D0C; stroke-width: 2; }
.w { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.up { stroke: #B8402F; } .down { stroke: #2F6CB0; } .pwr { stroke: #B57D0C; } .gnd { stroke: #4A5563; } .trig { stroke: #6B4FA0; } .acc { stroke: #5B7FA5; }
.dot { stroke: none; }
.f-up { fill: #B8402F; } .f-down { fill: #2F6CB0; } .f-pwr { fill: #B57D0C; } .f-gnd { fill: #4A5563; } .f-fg { fill: #1B2430; } .f-trig { fill: #6B4FA0; } .f-acc { fill: #5B7FA5; }
.mech { fill: none; stroke: #5A6675; stroke-width: 1.4; stroke-dasharray: 4 4; }
.ink { fill: none; stroke: #1B2430; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ghost { fill: none; stroke: #5A6675; stroke-width: 1.6; stroke-dasharray: 3 3; stroke-linecap: round; }
.axis { fill: none; stroke: #C9D2DC; stroke-width: 1.2; }
.link { fill: none; stroke: #5B7FA5; stroke-width: 2; stroke-dasharray: 7 5; }
.t-up { fill: #B8402F; } .t-down { fill: #2F6CB0; } .t-pwr { fill: #B57D0C; } .t-trig { fill: #6B4FA0; }
</style>
<rect x="0" y="0" width="820" height="300" fill="#FFFFFF"/>
<title>System: the phone and the BLE remote connect to the LH master module over Bluetooth; the master commands the RH module over ESP-NOW; each module connects to its retractor through a Y-adapter.</title>
        <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-acc" d="M0 0 L10 5 L0 10 z"/></marker></defs>
        <rect class="box" x="20" y="20" width="180" height="60" rx="2"/>
        <text class="ttl" x="110" y="45" text-anchor="middle">Phone</text>
        <text class="lbl" x="110" y="66" text-anchor="middle">Android app</text>
        <rect class="box" x="20" y="200" width="180" height="60" rx="2"/>
        <text class="ttl" x="110" y="225" text-anchor="middle">BLE remote</text>
        <text class="lbl" x="110" y="246" text-anchor="middle">shutter clicker</text>
        <rect class="box-soft" x="330" y="100" width="170" height="80" rx="2"/>
        <text class="ttl" x="415" y="132" text-anchor="middle">LH module</text>
        <text class="lbl" x="415" y="154" text-anchor="middle">master</text>
        <rect class="box-soft" x="640" y="100" width="160" height="80" rx="2"/>
        <text class="ttl" x="720" y="132" text-anchor="middle">RH module</text>
        <text class="lbl" x="720" y="154" text-anchor="middle">slave</text>
        <rect class="box" x="330" y="240" width="170" height="40" rx="2"/>
        <text x="415" y="265" text-anchor="middle">LH retractor</text>
        <rect class="box" x="640" y="240" width="160" height="40" rx="2"/>
        <text x="720" y="265" text-anchor="middle">RH retractor</text>
        <path class="link" d="M200 60 L328 118" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text class="lbl" x="258" y="70">BLE, bonded</text>
        <path class="link" d="M200 230 L328 164" marker-end="url(#arr)"/>
        <text class="lbl" x="262" y="222">BLE (HID)</text>
        <path class="link" d="M502 140 H638" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text class="lbl" x="570" y="130" text-anchor="middle">ESP-NOW</text>
        <text class="lbl" x="570" y="160" text-anchor="middle">commands + heartbeat</text>
        <path class="ink" d="M415 180 V240 M720 180 V240"/>
        <text class="lbl" x="424" y="215">Y-adapter</text>
        <text class="lbl" x="729" y="215">Y-adapter</text>
      </svg>