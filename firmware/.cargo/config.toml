[build]
target = "riscv32imc-esp-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c3"
ESP_IDF_VERSION = "v5.5.5"
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
# Virtual workspace: tell esp-idf-sys which crate is the binary.
ESP_IDF_SYS_ROOT_CRATE = "wink-app"
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "wink-app/sdkconfig.defaults", relative = true }
